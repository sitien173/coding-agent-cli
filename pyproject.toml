[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-cli"
version = "0.1.0"
description = "Run coding-agent CLIs from Python, stream typed events, and get a classified result."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "sitien173" }]
keywords = ["claude", "codex", "coding-agent", "cli", "subprocess", "asyncio"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sitien173/coding-agent-cli"
Issues = "https://github.com/sitien173/coding-agent-cli/issues"
Changelog = "https://github.com/sitien173/coding-agent-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = ["live: runs a real coding-agent CLI; excluded by default"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# Temp-file and path calls are microsecond-scale; offloading them to threads adds cost without benefit.
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "ASYNC221"]
