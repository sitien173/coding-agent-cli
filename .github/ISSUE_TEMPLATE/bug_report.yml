name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the `Result.outcome` and `Result.error` if relevant. Remove prompts, tokens, and private paths.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: coding-agent-cli, Python, OS, and the CLI's `--version` output
    validations:
      required: true
