name: Release

# Pushes to main run release-please, which keeps a release PR open with the next version and changelog.
# Merging that PR creates the tag and GitHub Release, then this workflow builds and publishes to PyPI.
# Pushing a v* tag by hand also publishes; use it for the first release.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
      # release-please bumps pyproject.toml but not uv.lock, so `uv sync --locked` would fail on the release PR.
      - if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@v10.3.3
      - if: steps.release.outputs.pr
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update uv.lock for release"
            git push
          fi

  build:
    needs: release-please
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${RP_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$TAG" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coding-agent-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    needs: [build, publish]
    if: ${{ !failure() && !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attach artifacts, creating the release for hand-pushed tags
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
